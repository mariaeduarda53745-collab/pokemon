<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>
<body class="bg-light">
    <header class="bg-danger text-white text-center py-1">
        <span class="text">Pokédex</span>
    </header>
    <main class="container py-4" style="max-width: 450px;">
        <section class="card shadow-sm mb-3">
            <div class="card-body">
                <h1 class="text-center fs-3 fw-normal mb-3">
                    Pesquisa um pokémon aí :)
                </h1>
                <div class="input-group">
                    <input
                        type="text"
                        id="pokemon"
                        class="form-control"
                        value="Pikachu"
                        placeholder="Digite o nome do Pokémon">
                    <button
                        class="btn btn-danger"
                        type="button"
                        onclick="buscarPokemon()">
                        Pesquisar
                    </button>
                </div>
                <p id="erro" class="text-danger text-center mt-2 mb-0"></p>
            </div>
        </section>
        <section id="resultado" class="card shadow-sm text-center d-none">
            <div class="card-body">
                <h2 id="nome" class="fs-3 fw-normal mb-2">
                    Pikachu #25
                </h2>
                <img
                    id="imagem"
                    src=""
                    alt="Imagem do Pokémon"
                    class="img-fluid d-block mx-auto"
                    width="230"
                    height="190">
                <hr>
                <div class="mb-3">
                    <div class="mb-1">Tipo</div>
                    <span id="tipo" class="badge bg-primary"></span>
                </div>
                <div class="row mb-4">
                    <div class="col-6">
                        <strong class="d-block">Altura</strong>
                        <span id="altura">-</span>
                    </div>
                    <div class="col-6">
                        <strong class="d-block">Peso</strong>
                        <span id="peso">-</span>
                    </div>
                </div>
                <h3 class="fs-6 fw-normal mb-3">Status</h3>
                <div class="text-start mb-3">
                    <div class="small mb-1">
                        HP: <span id="hpValor">0</span>
                    </div>
                    <div class="progress">
                        <div
                            id="hpBar"
                            class="progress-bar bg-danger"
                            role="progressbar">
                        </div>
                    </div>
                </div>
                <div class="text-start mb-3">
                    <div class="small mb-1">
                        Ataque: <span id="ataqueValor">0</span>
                    </div>
                    <div class="progress">
                        <div
                            id="ataqueBar"
                            class="progress-bar bg-warning"
                            role="progressbar">
                        </div>
                    </div>
                </div>
                <div class="text-start mb-3">
                    <div class="small mb-1">
                        Defesa: <span id="defesaValor">0</span>
                    </div>
                    <div class="progress">
                        <div
                            id="defesaBar"
                            class="progress-bar bg-info"
                            role="progressbar">
                        </div>
                    </div>
                </div>
                <div class="text-start mb-4">
                    <div class="small mb-1">
                        Velocidade: <span id="velocidadeValor">0</span>
                    </div>
                    <div class="progress">
                        <div
                            id="velocidadeBar"
                            class="progress-bar bg-success"
                            role="progressbar">
                        </div>
                    </div>
                </div>
                <h3 class="fs-6 fw-normal mb-3">
                    Habilidades
                </h3>
                <div
                    id="habilidades"
                    class="d-flex justify-content-center flex-wrap gap-2">
                </div>
            </div>
        </section>
    </main>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYjRrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
